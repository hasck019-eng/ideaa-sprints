<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Sprints</title>
<style>
:root{--bg:#f3f7f0;--card:#fff;--ink:#22332a;--mute:#5c6b62;--dark:#14432b;--mid:#1f6b43;--moss:#97bc62;--amber:#f2a900;--red:#c0392b;--line:#d6e2d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,Arial,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0 0 8px;color:var(--mid)}
header{background:var(--dark);color:#fff;padding:14px 16px}
header h1{color:#fff;font-size:24px;margin:0}header p{margin:2px 0 0;color:var(--moss);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--mid);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{background:var(--mid);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--amber);color:#222}.btn.red{background:var(--red)}.btn.ghost{background:transparent;color:var(--mid);border:1px solid var(--mid)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-weight:600;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.sev-Critical,.sev-High{background:var(--red);color:#fff}.sev-Medium{background:var(--amber);color:#222}.sev-Low{background:var(--moss);color:#123}
.st{display:flex;gap:4px;margin:8px 0}.st i{flex:1;height:6px;border-radius:3px;background:var(--line)}.st i.d{background:var(--mid)}
img.th{width:64px;height:64px;object-fit:cover;border-radius:10px;float:left;margin-right:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font:700 26px Cambria,serif;color:var(--mid)}
.warn{position:fixed;inset:0;background:rgba(120,15,10,.96);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.warn>div{max-width:420px;text-align:center}.warn h2{color:#fff;font-size:28px}
.note{font-size:13px;color:var(--mute)}.banner{background:var(--amber);color:#222;padding:8px 16px;font-weight:700;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}svg{width:100%;height:auto;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
[hidden]{display:none!important}

/* ===== ANIMATIONS ===== */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:.85;transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.85}50%{transform:scale(1.5);opacity:.4}100%{transform:scale(1);opacity:.85}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes scan{0%{top:0}100%{top:100%}}
@keyframes zoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes glow{0%,100%{box-shadow:inset 0 0 60px rgba(255,60,40,.25)}50%{box-shadow:inset 0 0 140px rgba(255,60,40,.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
header{background:linear-gradient(110deg,#14432b,#1f6b43,#14432b);background-size:200% 100%;animation:flow 8s linear infinite}
header h1::before{content:"\1F33E ";display:inline-block;animation:float 2.4s ease-in-out infinite}
header p{animation:up .7s .2s both}
.card,.stats div{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.2);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.96)}
nav button{transition:background .25s,color .25s,transform .15s}nav button:hover{transform:translateY(-1px)}
nav button.on{animation:zoom .3s both}
.st i.d{transform-origin:left;animation:fill .8s ease-out both}
.st i:nth-child(2).d{animation-delay:.15s}.st i:nth-child(3).d{animation-delay:.3s}.st i:nth-child(4).d{animation-delay:.45s}
.pin{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pin.pend{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,pulse 2s 1s ease-in-out infinite}
#pv{position:relative;display:inline-block;overflow:hidden;border-radius:10px}
#pv img{animation:zoom .4s both}
#pv.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--moss);box-shadow:0 0 14px 4px var(--moss);animation:scan 1.1s linear infinite}
#pv.scan img{filter:brightness(.8)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--mid);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
.warn{animation:fade .25s both,glow 1.6s ease-in-out infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
.warn>div{animation:zoom .35s cubic-bezier(.2,.9,.3,1.2) both}
.warn h2{animation:shake .6s .3s both}
.banner{animation:up .4s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

:root{--bg:#fff8d6;--card:#fffdf0;--ink:#3b3410;--mute:#75693a;--dark:#f5d94a;--mid:#8a5a00;--moss:#e6b800;--amber:#f2a900;--line:#f0dc8a}
header{background:linear-gradient(110deg,#ffe98a,#fff3b0,#ffe98a)!important;background-size:200% 100%;color:#3b3410!important;border-bottom:1px solid #f0dc8a}
header h1{color:#5a4600!important}header p{color:#7a6a2a!important}
header h1::before{content:"\1F31F "}
nav{box-shadow:0 2px 8px rgba(160,120,0,.08)}nav button.on{background:#8a5a00;color:#fff}
.card{box-shadow:0 2px 10px rgba(160,120,0,.10)}
.btn{background:#8a5a00;color:#fff}.btn.alt{background:#f2a900;color:#2b2200}.btn.ghost{color:#8a5a00;border-color:#8a5a00;background:transparent}
img.th{width:76px;height:76px}
</style></head><body>
<header style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><h1>Idea Sprints</h1><p id="tg">Snap a photo. Get help. Stay safe.</p></div><select id="lg" aria-label="Language" style="width:auto;margin:0" onchange="setLg(this.value)"><option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option><option value="te">తెలుగు</option><option value="ml">മലയാളം</option><option value="kn">ಕನ್ನಡ</option><option value="bn">বাংলা</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="pa">ਪੰਜਾਬੀ</option><option value="or">ଓଡ଼ିଆ</option><option value="ur">اردو</option></select></header>
<div id="off" class="banner" hidden>Offline: reports are saved on this phone and will sync when you are back online</div>
<nav id="nav"></nav><main id="app"></main>
<div id="ov" class="warn" hidden></div>
<script>
const CATS={"Broken road":"PWD (Roads)","Water leak":"Water Board","Illegal dumping":"Panchayat (Sanitation)","Power fault":"Electricity Board","Fire or accident":"Police / Emergency","Crime or safety":"Police","Other":"Panchayat"};
const STAGES=["Reported","Acknowledged","In progress","Resolved"];
const VILL=["Village A","Village B","Village C","Village D"];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let R=ld("is_reports",[]),Q=ld("is_queue",[]),N=ld("is_nums",[]),tab="report",cur={},sampleFn=null,canImg=false;
const ESC_DAYS=3;
function dist(a,b){const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function isEsc(r){return r.stage<3&&(Date.now()-r.t)>ESC_DAYS*864e5}
const TABS=[["report","Report"],["voice","Voice AI"],["near","Nearby"],["mine","My reports"],["dash","Authority"],["map","Transparency"],["shield","Scam Shield"]];
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?"on":""}" data-t="${t[0]}">${tr(t[0],t[1])}</button>`).join("");
 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function render(){nav();({report:vReport,voice:vVoice,near:vNear,mine:vMine,dash:vDash,map:vMap,shield:vShield})[tab]();if(tab==="mine")sendCard();window.scrollTo(0,0);anim()}
function anim(){
 document.querySelectorAll("main .card,.stats div").forEach((el,i)=>el.style.animationDelay=(i*70)+"ms");
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 document.querySelectorAll(".stats b").forEach(b=>{const T=parseInt(b.textContent)||0;if(!T)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);b.textContent=Math.round(T*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function stats(){const p=R.filter(r=>r.stage<3).length;return `<div class="stats"><div><b>${R.length}</b>Reports</div><div><b>${p}</b>Pending</div><div><b>${R.length-p}</b>Resolved</div></div>`}
function badge(r){return `<span class="tag sev-${r.sev}">${r.sev}</span> <span class="tag">${esc(r.cat)}</span> ${isEsc(r)?'<span class="tag sev-High">Escalated</span>':""}`}

/* ---------- Report ---------- */
function vReport(){
 $("#app").innerHTML=stats()+`<div class="card" style="margin-top:14px"><h2>Report a problem</h2>
 <label>1. Take a live photo</label><input type="file" id="ph" accept="image/*" capture="environment">
 <div id="pv"></div>
 <button class="btn" id="an" disabled>2. Detect with AI</button> <span class="note" id="anm"></span>
 <div id="res" style="margin-top:12px"></div></div>
 <div class="card" id="fm" hidden><h3>3. Confirm and send</h3>
 <label>Issue type</label><select id="cat">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Description</label><textarea id="ds" rows="2" placeholder="Describe the problem"></textarea>
 <div class="row"><button class="btn ghost" id="mic" hidden>Speak</button></div>
 <label>Location</label><div class="row"><button class="btn ghost" id="gps">Use my GPS</button><select id="vl" style="flex:1">${VILL.map(v=>`<option>${v}</option>`).join("")}</select></div>
 <p class="note" id="lc">No GPS yet. Pick a village or tap Use my GPS.</p>
 <button class="btn alt" id="sb">Submit report</button> <span id="sm" class="note"></span></div>`;
 const ph=$("#ph");
 ph.onchange=()=>{const f=ph.files[0];if(!f)return;cur={file:f};const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=120/Math.max(im.width,im.height);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cur.th=c.toDataURL("image/jpeg",.6);$("#pv").innerHTML=`<img src="${cur.th}" class="th" alt="preview" style="width:120px;height:auto;float:none">`};im.src=fr.result};fr.readAsDataURL(f);$("#an").disabled=false;$("#fm").hidden=false;$("#res").innerHTML=""};
 $("#an").onclick=analyze;
 $("#gps").onclick=()=>{if(!navigator.geolocation){$("#lc").textContent="GPS not available. Pick a village.";return}$("#lc").textContent="Locating...";navigator.geolocation.getCurrentPosition(p=>{cur.lat=p.coords.latitude;cur.lng=p.coords.longitude;$("#lc").textContent=`GPS locked: ${cur.lat.toFixed(4)}, ${cur.lng.toFixed(4)}`},()=>{$("#lc").textContent="GPS denied. Pick a village instead."},{timeout:8000,enableHighAccuracy:true})};
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){const m=$("#mic");m.hidden=false;m.onclick=()=>{try{const r=new SR();r.lang=SRL[LG];r.onresult=e=>{$("#ds").value=e.results[0][0].transcript};r.start()}catch(e){m.hidden=true}}}
 $("#sb").onclick=submit;
}
async function analyze(){
 const out=$("#res"),b=$("#an");
 if(!sampleFn||!canImg){out.innerHTML='<p class="note">AI detection is available when this page is opened inside Claude. Choose the issue type below.</p>';return}
 b.disabled=true;$("#pv").classList.add("scan");out.innerHTML='<p><span class="spin"></span>Analyzing photo...</p>';
 try{
  const d=await sampleFn.json(`You are the vision model of a rural issue reporting app in India. Look at the photo. Return ONLY JSON: {"valid":boolean (true only if the photo shows a real civic problem or hazard),"category":one of ${JSON.stringify(Object.keys(CATS))},"severity":"Low"|"Medium"|"High"|"Critical","confidence":number 0-100,"summary":"one short sentence describing what you see"}`,{images:cur.file,modelTier:"quick"});
  if(!d.valid){out.innerHTML=`<div class="card" style="border-color:var(--red)"><b>Report rejected</b><p>${esc(d.summary||"No valid civic issue found.")} Take a clear photo of the problem.</p></div>`;cur.rej=true}
  else{cur.rej=false;cur.ai=d;$("#cat").value=CATS[d.category]?d.category:"Other";$("#ds").value=d.summary||"";
   out.innerHTML=`<div class="card"><b>AI result:</b> ${esc(d.category)} <span class="tag sev-${esc(d.severity)}">${esc(d.severity)}</span> <span class="tag">${Math.round(d.confidence)}% confident</span><p>${esc(d.summary)}</p><p class="note">Routed to: <b>${esc(CATS[d.category]||CATS.Other)}</b>${d.confidence<70?" . Low confidence: please confirm the type below.":""}</p></div>`}
 }catch(e){out.innerHTML=`<p class="note">AI unavailable (${esc(e&&e.code||"error")}). Choose the issue type below.</p>`}
 b.disabled=false;$("#pv").classList.remove("scan");
}
function submit(){
 if(cur.rej){$("#sm").textContent="Fix the photo first.";return}
 if(!cur.th){$("#sm").textContent="Add a photo first.";return}
 const cat=$("#cat").value,vi=$("#vl").selectedIndex,base={lat:12.9+vi*.02,lng:77.5+vi*.02};
 const loc=cur.lat!=null?{lat:cur.lat,lng:cur.lng}:{lat:base.lat+(Math.random()-.5)*.004,lng:base.lng+(Math.random()-.5)*.004};
 const dup=R.find(r=>r.cat==cat&&r.stage<3&&dist(r,loc)<200);
 if(dup){dup.votes=(dup.votes||1)+1;sv("is_reports",R);$("#sm").textContent=`Same issue already reported nearby (${dup.id}). Merged and priority raised.`;return}
 const rep={id:"R"+Date.now().toString(36).toUpperCase(),cat,sev:cur.ai?.severity||"Medium",conf:cur.ai?.confidence||null,desc:$("#ds").value||cat,dept:CATS[cat],lat:loc.lat,lng:loc.lng,village:cur.lat!=null?"GPS":VILL[vi],th:cur.th,stage:0,t:Date.now(),votes:1};
 if(!navigator.onLine){Q.push(rep);sv("is_queue",Q);$("#sm").textContent="Offline: saved. It will sync automatically.";return}
 R.unshift(rep);sv("is_reports",R);cur={};tab="mine";render();
}
addEventListener("online",()=>{$("#off").hidden=true;if(Q.length){R=Q.concat(R);Q=[];sv("is_reports",R);sv("is_queue",Q);render()}});
addEventListener("offline",()=>{$("#off").hidden=false});

/* ---------- My reports / Authority ---------- */
function timeline(r){return `<div class="st">${STAGES.map((s,i)=>`<i class="${i<=r.stage?"d":""}" title="${s}"></i>`).join("")}</div><span class="note">${STAGES[r.stage]}</span>`}
function vMine(){
 $("#app").innerHTML=stats()+`<div style="margin-top:14px">`+(R.length?R.map(r=>`<div class="card" style="overflow:hidden"><img class="th" src="${r.th}" alt=""><b>${esc(r.desc)}</b><br>${badge(r)}<br><span class="note">${esc(r.id)} . ${esc(r.village)} . to ${esc(r.dept)}${r.votes>1?" . "+r.votes+" reports merged":""}</span>${timeline(r)}</div>`).join(""):'<div class="card">No reports yet. Go to Report and submit one, or load demo data below.</div>')+`</div><button class="btn ghost" id="dm">Load demo data</button> <button class="btn ghost" id="cl">Clear all</button>`;
 $("#dm").onclick=demoAll;$("#cl").onclick=()=>{R=[];sv("is_reports",R);render()};
}
function demo(){const c=Object.keys(CATS),s=["Low","Medium","High","Critical"];
 for(let i=0;i<10;i++){const v=i%4;R.push({id:"D"+i,cat:c[i%5],sev:s[i%4],desc:c[i%5]+" reported near "+VILL[v],dept:CATS[c[i%5]],lat:12.9+v*.02+Math.random()*.005,lng:77.5+v*.02+Math.random()*.005,village:VILL[v],th:demoImg(c[i%5]),stage:i%4,t:Date.now()-i*864e5,votes:1})}
 sv("is_reports",R);render()}
function vDash(){
 const dp=[...new Set(Object.values(CATS))];
 $("#app").innerHTML=stats()+`<div class="card" style="margin-top:14px"><h2>Authority dashboard</h2><div class="row"><select id="fd" style="flex:1"><option value="">All departments</option>${dp.map(d=>`<option>${d}</option>`).join("")}</select><select id="fs" style="flex:1"><option value="">All severity</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="scroll"><table id="tb"></table></div><p class="note">Reports unresolved for ${ESC_DAYS}+ days are marked Escalated to a senior officer.</p></div>`;
 const draw=()=>{const d=$("#fd").value,s=$("#fs").value;const o={Critical:0,High:1,Medium:2,Low:3};
  const L=R.filter(r=>(!d||r.dept==d)&&(!s||r.sev==s)).sort((a,b)=>o[a.sev]-o[b.sev]||b.votes-a.votes);
  $("#tb").innerHTML=L.length?`<tr><th>Issue</th><th>Priority</th><th>Status</th><th>Action</th></tr>`+L.map(r=>`<tr><td><b>${esc(r.cat)}</b><br><span class="note">${esc(r.village)} . ${esc(r.dept)}</span></td><td>${badge(r)}</td><td>${STAGES[r.stage]}</td><td>${r.stage<3?`<button class="btn" data-a="${esc(r.id)}">${["Acknowledge","Start work","Resolve"][r.stage]}</button>`:"Done"}</td></tr>`).join(""):"<tr><td>No reports match.</td></tr>";
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const r=R.find(x=>x.id==b.dataset.a);if(r){r.stage++;sv("is_reports",R);vDash()}})};
 $("#fd").onchange=draw;$("#fs").onchange=draw;draw();
}

/* ---------- Map ---------- */
function vMap(){
 if(!R.length){$("#app").innerHTML='<div class="card"><h2>Transparency map</h2>No data yet. Submit a report or load demo data in My reports.</div>';return}
 const la=R.map(r=>r.lat),ln=R.map(r=>r.lng),a0=Math.min(...la),a1=Math.max(...la),n0=Math.min(...ln),n1=Math.max(...ln);
 const X=v=>30+(n1==n0?.5:(v-n0)/(n1-n0))*440,Y=v=>270-(a1==a0?.5:(v-a0)/(a1-a0))*240;
 const pins=R.map((r,i)=>`<circle cx="${X(r.lng)}" cy="${Y(r.lat)}" r="9" class="pin${r.stage==3?"":" pend"}" style="animation-delay:${i*60}ms" fill="${r.stage==3?"#1f6b43":"#c0392b"}" opacity=".85"><title>${esc(r.cat)} - ${STAGES[r.stage]}</title></circle>`).join("");
 const by={};R.forEach(r=>{(by[r.village]=by[r.village]||{p:0,d:0})[r.stage==3?"d":"p"]++});
 const lb=Object.entries(by).sort((a,b)=>b[1].d-a[1].d);
 $("#app").innerHTML=stats()+`<div class="card" style="margin-top:14px"><h2>Public transparency map</h2><svg viewBox="0 0 500 300" role="img" aria-label="Map of reports">${pins}</svg><p class="note"><span style="color:#c0392b">&#9679;</span> Pending &nbsp; <span style="color:#1f6b43">&#9679;</span> Resolved</p></div><div class="card"><h3>Village leaderboard</h3><table>${lb.map(([v,x])=>`<tr><td>${esc(v)}</td><td>${x.d} resolved</td><td>${x.p} pending</td></tr>`).join("")}</table></div>`;
}

/* ---------- Scam Shield ---------- */

/* ---------- Nearby authorities + message (auto location) ---------- */
let NA=ld("is_auth",[]),NP=null;
const NAT=[["Emergency (police, fire, ambulance)","112"],["Cyber fraud helpline","1930"],["Ambulance","108"],["Fire","101"],["Women helpline","181"],["Child helpline","1098"]];
const ndig=n=>{let d=String(n||"").replace(/\D/g,"");if(d.length===10)d="91"+d;return d};
const gm=(q)=>NP?`https://www.google.com/maps/search/${encodeURIComponent(q)}/@${NP.lat},${NP.lng},14z`:`https://www.google.com/maps/search/${encodeURIComponent(q)}`;
function vNear(){

function vShield(){

function localScam(t){const x=t.toLowerCase(),W=[["otp",2,"Asks for an OTP or PIN"],["pin",1,"Mentions a PIN"],["kyc",2,"Fake KYC or account update"],["blocked",2,"Threatens to block your account"],["suspend",2,"Threatens suspension"],["disconnect",2,"Threatens disconnection"],["urgent",1,"Creates false urgency"],["immediately",1,"Creates false urgency"],["within 1 hour",2,"Tight deadline pressure"],["congratulations",2,"Unexpected prize claim"],["lucky draw",2,"Lottery or lucky draw"],["you won",2,"Unexpected prize claim"],["processing fee",3,"Asks for an upfront fee"],["claim",1,"Asks you to claim something"],["click",1,"Pushes you to click a link"],["verify",1,"Asks you to verify details"],["gpay",1,"Asks for a UPI payment"],["upi",1,"Asks for a UPI payment"],["pay ",1,"Asks for payment"]];
 let sc=0,rs=[];W.forEach(([k,w,r])=>{if(x.includes(k)){sc+=w;if(!rs.includes(r))rs.push(r)}});
 if(/https?:\/\/\S+\.(xyz|top|click|info|ru|cc|link)\b/.test(x)||/bit\.ly|tinyurl/.test(x)){sc+=3;rs.push("Suspicious link")}
 return{scam:sc>=4,risk:sc>=6?"High":sc>=3?"Medium":"Low",reasons:rs.slice(0,3),advice:sc>=4?"Do not click, pay or share any OTP. Report on 1930.":"No strong scam signs, but never share OTP or PIN."}}
function showScam(d,src){$("#mr").innerHTML=`<b style="color:${d.scam?"var(--red)":"var(--mid)"}">${d.scam?"Likely scam":"Looks safe"}</b> <span class="tag sev-${esc(d.risk)}">${esc(d.risk)} risk</span><ul>${(d.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>${esc(d.advice||"")}</p><p class="note">${src}</p>`}
